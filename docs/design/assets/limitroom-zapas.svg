  <rect x="5" y="4" width="110" height="110" rx="26" stroke="url(#edge)" fill="none" stroke-width="1"/>
  <circle cx="60" cy="59" r="31" fill="none" stroke="#f6ffff" stroke-opacity=".09" stroke-width="11"/>
  <path d="M81.9 80.9A31 31 0 1 0 38.1 80.9" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="60" cy="59" r="3" fill="#b9e6d7" opacity=".85"/>
