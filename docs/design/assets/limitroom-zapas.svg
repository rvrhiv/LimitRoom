<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 120 120" role="img" aria-labelledby="title description">
  <title id="title">LimitRoom — Запас</title>
  <desc id="description">Утверждённая иконка A: графитовая поверхность, светло-зелёное незамкнутое кольцо и центральная точка.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#304b4c"/>
