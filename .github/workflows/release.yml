name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in Config/App-Info.plist (e.g. 0.5.1)'
        required: true
        type: string
      build:
        description: 'Increasing CFBundleVersion already committed (e.g. 7)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: official-release
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'rvrhiv/LimitRoom'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          swift build
          swift format lint --strict --recursive Package.swift App Sources Scripts/generate-icon.swift
          bash Scripts/build-app.sh Release distribution
          bash Scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release
          path: build/releases/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'rvrhiv/LimitRoom'
    environment: release
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release
          path: build/releases/
      - name: Resolve pinned Sparkle tools
        run: swift package resolve
      - name: Sign and verify
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: bash Scripts/sign-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: bash Scripts/publish-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD" "$GITHUB_SHA"
